# Publish to PyPI when a version tag is pushed.
#
# Trusted publishing (OIDC), so there is no API token in the repository and no
# secret to rotate: PyPI is told which workflow in which repo may upload, and
# GitHub proves it is that workflow. Enable it once at
# https://pypi.org/manage/account/publishing/ — project `inshirah`, owner
# `umairkhancis`, repo `inshirah`, workflow `release.yml`, environment `pypi`.
#
# Homebrew is deliberately not automated here. It installs from the sdist PyPI
# serves, so it cannot run until this has finished, and its resource pins are
# generated by a `brew` command that wants a machine with Homebrew on it. See
# deploy/homebrew/README.md.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # One environment for the whole job. Creating it first matters: a bare
      # `uv run` makes a .venv of its own, and a later `uv venv` then refuses
      # to overwrite it — which is exactly how the first v0.1.0 tag failed.
      - run: uv venv
      - run: uv pip install -e '.[dev]'

      - name: The tag and the package must agree
        # The version lives in inshirah/__init__.py. A tag that says otherwise
        # would publish a release nobody can reproduce from the source.
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged=$(uv run python -c 'import inshirah; print(inshirah.__version__)')
          test "$tagged" = "$packaged" || {
            echo "tag $GITHUB_REF_NAME does not match __version__ $packaged"; exit 1;
          }

      - run: uv run pytest -q

      - run: uv build
      - run: uv run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # the whole of the authentication
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
